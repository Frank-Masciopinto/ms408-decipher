[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msdecipher"
version = "0.1.0"
description = "Descriptive-statistics framework for Beinecke MS 408 (Voynich manuscript) transcriptions. Not a decipherment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
images = ["opencv-python-headless>=4.8", "scipy>=1.10", "scikit-image>=0.21", "scikit-learn>=1.3"]

[project.scripts]
msdecipher = "msdecipher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["realdata: needs the downloaded voynich.nu transcriptions (run `python -m msdecipher fetch`)"]
